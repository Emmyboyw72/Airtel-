<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- 🔐 LOCK ZOOM & MOBILE VIEW FIX -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Welcome to Dingle</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #004d00;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      font-size: 18px;
      line-height: 1.6;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    .container {
      padding: 40px 20px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      margin-bottom: 40px;
    }

    .enter-btn {
      display: inline-block;
      background-color: #00cc66;
      color: white;
      font-size: 22px;
      padding: 16px 32px;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .enter-btn:hover {
      background-color: #00b359;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Dingle</h1>
    <p>Get ₦20,000 signup bonus and start earning instantly!</p>
    <a href="dashboard.html" class="enter-btn">Enter Dashboard</a>
  </div>
</body>
</html>
