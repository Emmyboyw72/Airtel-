<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Welcome to Dingle</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #004d00;
      font-family: Arial, sans-serif;
      color: white;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      font-size: 20px;
      overflow: hidden;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 20px;
    }

    p {
      font-size: 22px;
      margin-bottom: 40px;
    }

    .enter-btn {
      background-color: #00cc66;
      color: white;
      font-size: 22px;
      padding: 16px 36px;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .enter-btn:hover {
      background-color: #00b359;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Welcome to Dingle</h1>
    <p>Get ₦20,000 signup bonus and start earning instantly!</p>
    <a href="dashboard.html" class="enter-btn">Enter Dashboard</a>
  </div>
</body>
</html>
