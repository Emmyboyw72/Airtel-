<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glovo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #e50914; /* Glovo red */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
        }

        .brand-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 40px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        .food-container {
            position: relative;
            margin-bottom: 30px;
        }

        .food-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 16px;
            animation: spin 8s linear infinite;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            border: 3px solid white;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: white;
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        .dot:nth-child(3) { animation-delay: 0s; }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="brand-title">Glovo</div>

    <div class="food-container">
        <!-- 🍽️ Beautiful food image with fork & spoon -->
        <img
            src="https://unsplash.com/photos/a-plate-of-food-with-a-fork-and-a-spoon-2lboyunY0cw"
            alt="Delicious meal with fork and spoon"
            class="food-image"
        />
    </div>

    <div class="loader">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <!-- Firebase via CDN -->

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyASOh_kA_d_L3T3L78Lvid0rjLKccKVFpw",
            authDomain: "glovo-a0ea4.firebaseapp.com",
            projectId: "glovo-a0ea4",
            storageBucket: "glovo-a0ea4.firebasestorage.app",
            messagingSenderId: "737022109409",
            appId: "1:737022109409:web:84a0966d3681f3960479a0",
            measurementId: "G-W2BMB39T29"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);

        // Redirect after 2 seconds
        setTimeout(() => {
            const isSignedIn = localStorage.getItem('isSignedIn') === 'true';
            if (isSignedIn) {
                window.location.href = 'dashboard.html';
            } else {

            }

</body>
