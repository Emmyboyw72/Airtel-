<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Welcome to Dingle</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #004d00;
      font-family: Arial, sans-serif;
      color: white;
      font-size: 20px;
      overflow: hidden;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      opacity: 1;
      transition: opacity 1.2s ease-in-out;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 20px;
    }

    p {
      font-size: 22px;
    }
  </style>

  <script>
    window.onload = () => {
      setTimeout(() => {
        document.querySelector(".wrapper").style.opacity = 0;
        setTimeout(() => {
          window.location.href = "signup.html";
        }, 1200);
      }, 3000);
    };
  </script>
</head>

<body>
  <div class="wrapper">
    <h1>Welcome to Dingle</h1>
    <p>Get ₦20,000 signup bonus and start earning instantly!</p>
  </div>
</body>
</html>
