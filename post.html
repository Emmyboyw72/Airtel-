<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Post | Emmy Social</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f0f2f5;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: auto;
    }

    textarea {
      width: 100%;
      padding: 10px;
      resize: none;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    input[type="file"] {
      margin-top: 10px;
    }

    button {
      background: #1877f2;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      margin-top: 15px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <h3>Create a Post</h3>
    <textarea id="text" rows="4" placeholder="What's on your mind?"></textarea>
    <input type="file" id="media" accept="image/*,video/*" />
    <button onclick="uploadPost()">Post</button>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js"></script>
  <script>
    const supabase = supabase.createClient(
      'https://jjbxaoorxwomaudjrfwt.supabase.co',
      'YOUR_SUPABASE_ANON_KEY' // Replace with your real anon key
    );

    const user = JSON.parse(localStorage.getItem("emmyUser"));
    if (!user) location.href = "login.html";

    async function uploadPost() {
      const text = document.getElementById("text").value.trim();
      const file = document.getElementById("media").files[0];

      if (!text && !file) {
        alert("Please enter text or select a media file.");
        return;
      }

      let media_url = null;

      if (file) {
        const ext = file.name.split(".").pop();
        const path = `posts/${user.id}_${Date.now()}.${ext}`;

        const { data, error } = await supabase.storage
          .from("media")
          .upload(path, file, {
            cacheControl: "3600",
            upsert: false
          });

        if (error) {
          alert("Media upload failed: " + error.message);
          return;
        }

        const { publicUrl } = supabase.storage.from("media").getPublicUrl(path).data;
        media_url = publicUrl;
      }

      const { error: insertError } = await supabase
        .from("posts")
        .insert([
          {
            user_id: user.id,
            text: text,
            media_url: media_url,
            created_at: new Date().toISOString()
          }
        ]);

      if (insertError) {
        alert("Post failed: " + insertError.message);
        return;
      }

      alert("Post uploaded successfully!");
      location.href = "dashboard.html"; // Go back to dashboard
    }
  </script>
</body>
</html>
