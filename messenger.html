<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat – Glovo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: #e50914;
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            margin-right: 12px;
            cursor: pointer;
        }

        .chat-header-info {
            flex: 1;
        }

        .chat-header-title {
            font-weight: bold;
            font-size: 18px;
        }

        .chat-header-subtitle {
            font-size: 13px;
            opacity: 0.9;
        }

        .messages-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-bubble {
            max-width: 70%;
            position: relative;
        }

        .message {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            -webkit-user-select: none; /* No text highlighting */
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .message.received {
            background: white;
            border-bottom-left-radius: 4px;
        }

        .message.sent {
            background: #e50914;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-info {
            font-size: 11px;
            margin-top: 4px;
            opacity: 0.7;
            display: flex;
            justify-content: flex-end;
        }

        .message.sent + .message-info {
            color: #ffcccc;
        }

        .delete-btn {
            position: absolute;
            top: -20px;
            right: 0;
            background: none;
            border: none;
            color: #e50914;
            font-size: 14px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message-bubble:hover .delete-btn {
            opacity: 1;
        }

        .input-area {
            display: flex;
            padding: 10px;
            background: white;
            border-top: 1px solid #ddd;
            align-items: center;
        }

        .emoji-toggle {
            background: none;
            border: none;
            font-size: 22px;
            color: #555;
            margin: 0 8px;
            cursor: pointer;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 16px;
            outline: none;
        }

        .send-btn {
            background: #e50914;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            margin-left: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .emoji-picker {
            display: none;
            position: absolute;
            bottom: 70px;
            left: 0;
            right: 0;
            background: white;
            padding: 16px;
            border-top: 1px solid #eee;
            z-index: 90;
            overflow-y: auto;
            max-height: 200px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .emoji {
            font-size: 24px;
            cursor: pointer;
            user-select: none;
        }

        /* Beautiful Alert */
        .alert {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            padding: 16px 24px;
            border-radius: 16px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            opacity: 0;
            transition: transform 0.4s ease, opacity 0.4s ease;
            text-align: center;
            max-width: 90%;
        }

        .alert.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* Confirmation Popup */
        #confirmPopup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            background: white;
            padding: 24px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
        }

        .popup-title {
            color: #e50914;
            font-size: 18px;
            margin-bottom: 16px;
        }

        .popup-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .popup-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancel {
            background: #f1f1f1;
            color: #333;
        }

        .btn-delete {
            background: #d32f2f;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <button class="back-btn" onclick="window.location.href='friends.html'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="chat-header-info">
            <div class="chat-header-title">Glovo</div>
            <div class="chat-header-subtitle">Admin</div>
        </div>
    </header>

    <div class="messages-container" id="messagesContainer">
        <!-- Messages appear here -->
    </div>

    <div class="emoji-picker" id="emojiPicker"></div>

    <div class="input-area">
        <button class="emoji-toggle" id="emojiToggle">😊</button>
        <input type="text" class="message-input" id="messageInput" placeholder="Type a message..." />
        <button class="send-btn" id="sendBtn">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <!-- Alert -->
    <div id="alert" class="alert">
        <div id="alert-message">Message sent!</div>
    </div>

    <!-- Delete Confirmation Popup -->
    <div id="confirmPopup">
        <div class="popup-content">
            <div class="popup-title">Delete Message</div>
            <p>Are you sure you want to delete this message for everyone?</p>
            <div class="popup-buttons">
                <button class="popup-btn btn-cancel" onclick="closeConfirmPopup()">Cancel</button>
                <button class="popup-btn btn-delete" onclick="confirmDeleteMessage()">Delete</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyASOh_kA_d_L3T3L78Lvid0rjLKccKVFpw",
            authDomain: "glovo-a0ea4.firebaseapp.com",
            projectId: "glovo-a0ea4",
            storageBucket: "glovo-a0ea4.firebasestorage.app",
            messagingSenderId: "737022109409",
            appId: "1:737022109409:web:84a0966d3681f3960479a0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_EMAIL = "bluepay863@gmail.com";
        const ADMIN_UID = "admin";
        const CHAT_ROOM = "support_chat";
        let currentUser = null;
        let messageToDelete = null;

        const emojis = "😘😂👋🤭😏👀🥹🤣🙆😅🤔☺️🤓👌😀🥺😎😔👍😊🫣😁🥰🙇😳🙂😉❤️😭🙄💔👑😲🥱❤️‍🩹👏🤤😋😛😝😜🤪🥴😔🥺😬😑😐😶😶‍🌫️🫥🤐🫡🤔🧐🤨😱🫣🤗🥱🤭🫢🫢😟😥😢😒🙄😮‍💨☹️😤😠🙁😡🫤🤬😕😞😰😓😨😣😴😖🤮🤯🤢😳🥵😲🥶😵‍💫😯😮😫😦😧😩😪🤧🤒🤕😷🤥😇🤠🤑💀👻👿😈💩🤡🥸😎🤓☠️👹👺☃️🎃⛄🤖👽👾🌚🌝🌞🌛🌜😺😸😹😻💫🙊🙉🙈😾😿🙀😽😼💯🔥❤️🧡💚❤️‍🩹💙🤍🗣️💋♥️💋👣👥👄🫂🤲👍🦵👃🙌🤙🖖👆☝️👇👌🤳🤝💅🤦🙇🧍🧘🙋⛹️🧑‍🦼🏌️🧗💂🧑‍🚀🫅👰";

        function showAlert(message, isError = false) {
            const alertEl = document.getElementById('alert');
            document.getElementById('alert-message').textContent = message;
            alertEl.style.background = isError ? '#d32f2f' : '#00c853';
            alertEl.className = 'alert show';
            setTimeout(() => alertEl.classList.remove('show'), 3000);
        }

        function formatTime(timestamp) {
            if (!timestamp) return "";
            const date = timestamp.toDate();
            let hours = date.getHours();
            const minutes = date.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            return `${hours}:${minutes} ${ampm}`;
        }

        function renderMessages(messages) {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            messages.forEach(msg => {
                const isSent = msg.senderId === currentUser.uid;
                const isDeletable = isSent; // Only user can delete their own

                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';

                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isSent ? 'sent' : 'received'}`;
                messageDiv.textContent = msg.text;

                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-info';
                timeDiv.textContent = formatTime(msg.timestamp);

                bubble.appendChild(messageDiv);
                bubble.appendChild(timeDiv);

                if (isDeletable) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
                    deleteBtn.onclick = (e) => {
                        e.stopPropagation();
                        messageToDelete = { id: msg.id, senderId: msg.senderId };
                        document.getElementById('confirmPopup').style.display = 'flex';
                    };
                    bubble.appendChild(deleteBtn);
                }

                container.appendChild(bubble);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            try {
                await addDoc(collection(db, "chats", CHAT_ROOM, "messages"), {
                    text: text,
                    senderId: currentUser.uid,
                    senderEmail: currentUser.email,
                    timestamp: serverTimestamp()
                });
                input.value = '';
                showAlert("Message sent!", false);
            } catch (err) {
                console.error("Send error:", err);
                showAlert("Failed to send message.", true);
            }
        }

        function toggleEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            const input = document.getElementById('messageInput');
            if (picker.style.display === 'flex') {
                picker.style.display = 'none';
                input.style.display = 'block';
            } else {
                picker.style.display = 'flex';
                input.style.display = 'none';
                input.blur();
            }
        }

        function addEmoji(emoji) {
            const input = document.getElementById('messageInput');
            input.style.display = 'block';
            input.value += emoji;
            input.focus();
            document.getElementById('emojiPicker').style.display = 'none';
        }

        function closeConfirmPopup() {
            document.getElementById('confirmPopup').style.display = 'none';
            messageToDelete = null;
        }

        async function confirmDeleteMessage() {
            if (!messageToDelete) return;
            try {
                await deleteDoc(doc(db, "chats", CHAT_ROOM, "messages", messageToDelete.id));
                showAlert("Message deleted for everyone.", false);
            } catch (err) {
                console.error("Delete error:", err);
                showAlert("Failed to delete message.", true);
            }
            closeConfirmPopup();
        }

        function initEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            emojis.split('').forEach(emoji => {
                const span = document.createElement('span');
                span.className = 'emoji';
                span.textContent = emoji;
                span.onclick = () => addEmoji(emoji);
                picker.appendChild(span);
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;

                // Send welcome message if first time
                const chatRef = collection(db, "chats", CHAT_ROOM, "messages");
                const chatSnap = await (await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")).getDocs(chatRef);
                if (chatSnap.empty) {
                    await addDoc(chatRef, {
                        text: "👋 Thanks for choosing our delivery app! We will make sure to serve you with excellence.",
                        senderId: ADMIN_UID,
                        senderEmail: ADMIN_EMAIL,
                        timestamp: serverTimestamp()
                    });
                }

                // Listen to messages
                const q = query(chatRef, orderBy("timestamp", "asc"));
                onSnapshot(q, (snapshot) => {
                    const messages = [];
                    snapshot.forEach(doc => {
                        messages.push({ id: doc.id, ...doc.data() });
                    });
                    renderMessages(messages);
                });

                initEmojiPicker();

                // Event listeners
                document.getElementById('sendBtn').onclick = sendMessage;
                document.getElementById('emojiToggle').onclick = toggleEmojiPicker;
                document.getElementById('messageInput').onkeypress = (e) => {
                    if (e.key === 'Enter') sendMessage();
                };
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
