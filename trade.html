<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dingle – Trade</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="common.js"></script>
  <style>
    body { font-family: Arial; margin: 0; background: #0f0f0f; color: #fff; text-align: center; }
    h2 { margin: 20px 0; }
    .box {
      background: #1a1a1a; padding: 20px; margin: 15px auto;
      border-radius: 10px; max-width: 500px; width: 90%;
    }
    input, select, button {
      width: 100%; padding: 14px; margin-top: 10px;
      border: none; border-radius: 8px; font-size: 16px;
    }
    button { font-weight: bold; cursor: pointer; }
    #start { background: #00cc66; color: #fff; }
    #withdraw { background: #ff3333; color: #fff; display: none; }
    canvas { background: #111; border-radius: 8px; margin-top: 10px; }
    .info { margin-top: 15px; font-size: 18px; }
  </style>
</head>
<body>

<h2>📊 Dingle Live Trade</h2>

<div class="box">
  <label>Select Coin</label>
  <select id="coin">
    <option value="BTC">🟠 Bitcoin (BTC)</option>
    <option value="ETH">🟣 Ethereum (ETH)</option>
    <option value="SOL">🟡 Solana (SOL)</option>
  </select>

  <label>Enter Stake Amount (min ₦1000)</label>
  <input id="amount" type="number" min="1000" placeholder="₦1000 or more" />

  <button id="start" onclick="startTrade()">BUY / Start Trade</button>
  <button id="withdraw" onclick="stopTrade()">WITHDRAW</button>
</div>

<canvas id="chart" width="400" height="280"></canvas>

<div class="info">
  <p>⏱️ Time: <span id="timer">0s</span></p>
  <p>💸 Current Value: ₦<span id="val">0.00</span></p>
  <p>📊 Profit/Loss: <span id="net">₦0.00</span> (<span id="percent">0%</span>)</p>
</div>

<script>
const TRADE_KEY = "dingle_trade";
const TICK_MS = 2000; // every 2 seconds
let timer = null, seconds = 0, stake = 0, coin = "", current = 0;
let data = [], labels = [];
let chart;

// Draw Chart
function initChart() {
  const ctx = document.getElementById("chart");
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        data,
        borderColor: "#00ff99",
        tension: 0.4,
        pointRadius: 0
      }]
    },
    options: {
      animation: false,
      scales: { x: { display: false }, y: { ticks: { color: "#ccc" } } },
      plugins: { legend: { display: false } }
    }
  });
}

// Every tick: simulate value change
function tick() {
  const change = Math.random() * 0.1 - 0.05; // -5% to +5%
  current = Math.max(0, current + stake * change);
  data.push(current.toFixed(2)); labels.push("");
  if (data.length > 30) { data.shift(); labels.shift(); }

  const gain = current - stake;
  const gainPct = ((gain / stake) * 100).toFixed(1);

  chart.data.datasets[0].borderColor = gain >= 0 ? "#00ff66" : "#ff3333";
  chart.update();

  document.getElementById("val").textContent = current.toFixed(2);
  document.getElementById("net").textContent = `₦${gain.toFixed(2)}`;
  document.getElementById("percent").textContent = `${gainPct}%`;

  seconds += 2;
  document.getElementById("timer").textContent = `${seconds}s`;

  saveState();
}

// Save trade in localStorage
function saveState() {
  localStorage.setItem(TRADE_KEY, JSON.stringify({ stake, coin, current, data, seconds }));
}

// Start Trade
function startTrade() {
  stake = Number(document.getElementById("amount").value);
  coin = document.getElementById("coin").value;

  if (isNaN(stake) || stake < 1000) {
    alert("Minimum stake is ₦1000");
    return;
  }

  let u = getUser();
  if (u.balance < stake) {
    alert("Insufficient balance");
    return;
  }

  u.balance -= stake; setUser(u);
  addHistory("trade-start", stake, -stake, `${coin} stake`);
  
  // init trade
  current = stake;
  data = [stake]; labels = [""];
  seconds = 0;

  if (!chart) initChart();
  else { chart.data.datasets[0].data = data; chart.update(); }

  document.getElementById("start").style.display = "none";
  document.getElementById("withdraw").style.display = "block";
  timer = setInterval(tick, TICK_MS);
  saveState();
}

// Stop Trade
function stopTrade() {
  clearInterval(timer);
  const profit = current - stake;

  let u = getUser();
  u.balance += current;
  setUser(u);

  addHistory("trade-end", stake, profit, `${coin} return`);
  alert(`Trade closed: ₦${current.toFixed(2)} (${profit >= 0 ? "+" : ""}₦${profit.toFixed(2)})`);

  document.getElementById("start").style.display = "block";
  document.getElementById("withdraw").style.display = "none";
  localStorage.removeItem(TRADE_KEY);
}

// Resume if already trading
window.onload = () => {
  const saved = JSON.parse(localStorage.getItem(TRADE_KEY) || "null");
  if (saved) {
    stake = saved.stake; coin = saved.coin;
    current = saved.current; data = saved.data;
    seconds = saved.seconds || 0;
    labels = Array(data.length).fill("");

    initChart();
    chart.data.datasets[0].data = data;
    chart.update();

    document.getElementById("amount").value = stake;
    document.getElementById("coin").value = coin;
    document.getElementById("start").style.display = "none";
    document.getElementById("withdraw").style.display = "block";
    timer = setInterval(tick, TICK_MS);
    tick(); // immediately update
  }
};
</script>
</body>
</html>
