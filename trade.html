<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trade – Dingle</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #fff; font-size: 18px; }
    h2 { text-align: center; color: #004d00; }
    .chart {
      width: 100%; height: 200px; background: #e6f9f0;
      margin: 20px 0; position: relative; overflow: hidden;
    }
    .line {
      height: 2px; width: 100%; position: absolute;
      animation: pulse 2s infinite alternate;
    }
    .line.up { background: green; top: 40%; }
    .line.down { background: red; top: 60%; }@keyframes pulse {
  0% { transform: scaleX(0.9); }
  100% { transform: scaleX(1.1); }
}

button {
  display: block; margin: 15px auto; padding: 15px;
  font-size: 18px; font-weight: bold;
  background: #00cc66; color: #fff; border: none; border-radius: 10px;
  cursor: pointer; max-width: 400px; width: 100%;
}
button:hover { background: #00994d; }
.msg { text-align: center; margin-top: 20px; font-weight: bold; }

  </style>
</head>
<body>
<h2>Crypto Trade</h2>
<div class="chart">
  <div class="line up"></div>
  <div class="line down"></div>
</div>
<button onclick="startTrade()">Start Trade (₦1000)</button>
<button onclick="endTrade()">Withdraw from Trade</button>
<div class="msg" id="msg"></div><script>
if (localStorage.getItem("dingle_balance") === null) localStorage.setItem("dingle_balance", "20000");

let tradeValue = 1000;
let running = false;
let interval;

function startTrade() {
  let bal = parseFloat(localStorage.getItem("dingle_balance"));
  if (bal < 1000 || running) return alert("❌ Not enough balance or trade already running");

  bal -= 1000;
  localStorage.setItem("dingle_balance", bal);
  tradeValue = 1000;
  running = true;

  interval = setInterval(() => {
    const change = (Math.random() - 0.5) * 200;
    tradeValue += change;
    document.getElementById("msg").innerText = `📈 Trade Value: ₦${tradeValue.toFixed(2)}`;
  }, 3000);
}

function endTrade() {
  if (!running) return alert("❌ No trade running");
  clearInterval(interval);
  running = false;

  let bal = parseFloat(localStorage.getItem("dingle_balance"));
  bal += tradeValue;
  localStorage.setItem("dingle_balance", bal);

  const history = JSON.parse(localStorage.getItem("dingle_history") || "[]");
  history.unshift({
    type: "Trade",
    result: tradeValue.toFixed(2),
    time: new Date().toLocaleString()
  });
  localStorage.setItem("dingle_history", JSON.stringify(history));

  document.getElementById("msg").innerText = `✅ Trade closed: ₦${tradeValue.toFixed(2)} added. New balance: ₦${bal.toFixed(2)}`;
}
</script></body>
</html>
