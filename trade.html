<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dingle Trade</title>
<style>
  body{font-family:Arial;margin:0;background:#0d0d0d;color:#fff;display:flex;flex-direction:column;align-items:center}
  h2{margin:20px 0}
  #chart{width:90%;max-width:500px;height:300px;border:1px solid #333;border-radius:8px;background:#111}
  button{margin:20px;width:90%;max-width:500px;padding:15px;font-size:18px;font-weight:bold;border:none;border-radius:10px;cursor:pointer}
  #start{background:#00cc66;color:#fff}
  #withdraw{background:#ff3333;color:#fff;display:none}
</style>
</head>
<body>

<h2>📈 Live Trade</h2>
<canvas id="chart"></canvas>

<button id="start" onclick="startTrade()">Start Trade (₦1 000)</button>
<button id="withdraw" onclick="stopTrade()">Withdraw / Stop</button>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
/* ---------- helpers ---------- */
const BAL_KEY   = "dingle_logged_in";
const TRADE_KEY = "dingle_trade";
const HIST_KEY  = "dingle_history";
const STAKE     = 1000;                       // ₦ staked each trade
const TICK_MS   = 1500;                       // 1.5-sec update
let timer=null, chart, data=[], labels=[], currentVal=STAKE;

/* ---------- setup chart ---------- */
function initChart(){
  const ctx=document.getElementById("chart");
  chart=new Chart(ctx,{type:"line",data:{
    labels, datasets:[{data, fill:false, tension:.4,
      borderColor:"#00ff77", pointRadius:0}]
  },options:{animation:false, plugins:{legend:{display:false}},
    scales:{x:{display:false},y:{ticks:{color:"#888"}}}}); }

/* ---------- random walk ---------- */
function tick(){
  let change = (Math.random()*0.12-0.06)*STAKE;      // ±6 % max step
  currentVal = Math.max(0, currentVal + change);     // never below 0
  data.push(currentVal.toFixed(2));
  labels.push("");                                   // dummy label
  if(data.length>60){data.shift();labels.shift();}   // keep 60 points
  chart.update();

  // color flips red if loss
  chart.data.datasets[0].borderColor = currentVal>=STAKE ? "#00ff77" : "#ff4444";
  saveTrade();                                       // persist state
}

/* ---------- persistence ---------- */
function saveTrade(){
  localStorage.setItem(TRADE_KEY, JSON.stringify({
    start: Date.now(), data, currentVal
  }));
}
function clearTrade(){ localStorage.removeItem(TRADE_KEY); }

/* ---------- balance helpers ---------- */
function getUser(){return JSON.parse(localStorage.getItem(BAL_KEY)||"{}");}
function setUser(u){localStorage.setItem(BAL_KEY,JSON.stringify(u));}

/* ---------- history helpers ---------- */
function addHistory(type,amount,result){
  const h=JSON.parse(localStorage.getItem(HIST_KEY)||"[]");
  h.unshift({type,amount,result,time:new Date().toLocaleString()});
  localStorage.setItem(HIST_KEY,JSON.stringify(h));
}

/* ---------- start ---------- */
function startTrade(){
  let u=getUser();
  if(!u.name){alert("Please log in");return;}
  if(u.balance<STAKE){alert("Insufficient balance");return;}

  // deduct stake once at start
  u.balance-=STAKE; setUser(u);
  currentVal=STAKE; data=[STAKE]; labels=[""];

  initChart();
  document.getElementById("start").style.display="none";
  document.getElementById("withdraw").style.display="block";

  timer=setInterval(tick,TICK_MS);
  saveTrade();
}

/* ---------- stop ---------- */
function stopTrade(){
  clearInterval(timer);
  document.getElementById("withdraw").style.display="none";
  document.getElementById("start").style.display="block";
  clearTrade();

  // pay out
  let u=getUser();
  const profit = parseFloat(currentVal.toFixed(2));
  const net    = profit-STAKE;
  u.balance   += profit;
  setUser(u);

  addHistory("trade", STAKE, net);
  alert(`Trade closed.\nStake: ₦${STAKE}\nReturn: ₦${profit.toFixed(2)}\nNet: ₦${net.toFixed(2)}`);
}

/* ---------- resume if trade exists ---------- */
window.onload=()=>{
  const saved=JSON.parse(localStorage.getItem(TRADE_KEY)||"null");
  initChart();
  if(saved){
    data   = saved.data;
    labels = Array(saved.data.length).fill("");
    currentVal = saved.currentVal;
    chart.data.labels=labels;
    chart.data.datasets[0].data=data;
    chart.update();

    document.getElementById("start").style.display="none";
    document.getElementById("withdraw").style.display="block";
    timer=setInterval(tick,TICK_MS);
  }
};
</script>
</body>
</html>
