<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Buy Code – Dingle</title>
  <style>
    html, body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111;
      font-size: 18px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    h2 {
      font-size: 26px;
      text-align: center;
      margin-bottom: 20px;
    }

    .info-box {
      background: #f2f2f2;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .info-box p {
      margin: 10px 0;
      font-size: 17px;
    }

    .copy-btn {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      background-color: #00cc66;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .copy-btn:hover {
      background-color: #00994d;
    }

    button {
      width: 100%;
      max-width: 400px;
      padding: 14px;
      margin: 20px auto;
      display: block;
      font-size: 20px;
      background-color: #004d00;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #003300;
    }

    .back a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #00aa55;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h2>Buy Dingle Code – ₦8000</h2>

  <div class="info-box">
    <p><strong>Send ₦8000 to:</strong></p>
    <p><strong>Acct Name:</strong> Nkechinyere Angela OTI</p>
    <p><strong>Bank:</strong> Access Bank</p>
    <p>
      <strong>Account No:</strong> 
      <span id="accountNum">1450464068</span>
      <button class="copy-btn" onclick="copyAccount()">Copy</button>
    </p>
  </div>

  <button onclick="confirmPayment()">✅ I Have Paid</button>

  <div class="back"><a href="dashboard.html">← Back to Dashboard</a></div>

  <script>
    function copyAccount() {
      const text = document.getElementById("accountNum").innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert("Account number copied!");
      });
    }

    function confirmPayment() {
      alert("✅ Confirming your transaction...");
      setTimeout(() => {
        alert("⏳ Please wait… Still confirming your payment.");
      }, 2500);
    }
  </script>

</body>
</html>
