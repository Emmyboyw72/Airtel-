<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile - TikTok Style</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      background-color: #000;
      color: #fff;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .profile-header {
      padding: 1rem;
      text-align: center;
      border-bottom: 1px solid #333;
      position: relative;
    }

    .profile-pic-container {
      position: relative;
      display: inline-block;
    }

    .profile-pic {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #fff;
      object-fit: cover;
    }

    .camera-icon {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #007bff;
      border-radius: 50%;
      padding: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .username {
      font-size: 1.5rem;
      font-weight: bold;
      margin-top: 0.5rem;
    }

    .bio {
      font-size: 0.9rem;
      margin-top: 0.3rem;
      color: #ccc;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 1rem;
    }

    .stat {
      text-align: center;
    }

    .stat h4 {
      margin: 0;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .buttons button {
      background-color: #222;
      color: white;
      border: 1px solid #555;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      cursor: pointer;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      margin-top: 1rem;
    }

    .video-grid video {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="profile-header">
    <div class="profile-pic-container">
      <img src="https://via.placeholder.com/100" class="profile-pic" id="profile-pic" alt="Profile Picture">
      <label for="avatar-upload" class="camera-icon"><i class="fas fa-camera"></i></label>
      <input type="file" id="avatar-upload" accept="image/*" />
    </div>
    <div class="username" id="username">@username</div>
    <div class="bio" id="bio">This is your bio</div>

    <div class="stats">
      <div class="stat">
        <h4 id="followers">0</h4>
        <p>Followers</p>
      </div>
      <div class="stat">
        <h4 id="following">0</h4>
        <p>Following</p>
      </div>
      <div class="stat">
        <h4 id="likes">0</h4>
        <p>Likes</p>
      </div>
    </div>

    <div class="buttons">
      <button onclick="editProfile()">Edit Profile</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="video-grid" id="video-grid"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabaseUrl = 'https://YOUR-SUPABASE-URL.supabase.co';
    const supabaseKey = 'YOUR-SUPABASE-ANON-KEY';
    const supabase = createClient(supabaseUrl, supabaseKey);

    const userId = localStorage.getItem('user_id');

    async function loadProfile() {
      const { data: profile } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', userId)
        .single();

      if (profile) {
        document.getElementById('username').innerText = `@${profile.username}`;
        document.getElementById('bio').innerText = profile.bio || 'No bio yet';
        document.getElementById('profile-pic').src = profile.avatar_url || 'https://via.placeholder.com/100';
        document.getElementById('followers').innerText = profile.followers || 0;
        document.getElementById('following').innerText = profile.following || 0;
        document.getElementById('likes').innerText = profile.likes || 0;
      }
    }

    async function loadVideos() {
      const { data: videos } = await supabase
        .from('videos')
        .select('*')
        .eq('user_id', userId);

      const grid = document.getElementById('video-grid');
      grid.innerHTML = '';

      videos.forEach(video => {
        const vid = document.createElement('video');
        vid.src = video.video_url;
        vid.controls = true;
        grid.appendChild(vid);
      });
    }

    // Upload new profile picture
    document.getElementById('avatar-upload').addEventListener('change', async function (e) {
      const file = e.target.files[0];
      if (!file) return;

      const fileExt = file.name.split('.').pop();
      const filePath = `avatars/${userId}.${fileExt}`;

      let { error: uploadError } = await supabase.storage
        .from('avatars')
        .upload(filePath, file, { upsert: true });

      if (uploadError) {
        alert('Upload failed: ' + uploadError.message);
        return;
      }

      const { data: { publicUrl } } = supabase
        .storage
        .from('avatars')
        .getPublicUrl(filePath);

      await supabase
        .from('profiles')
        .update({ avatar_url: publicUrl })
        .eq('id', userId);

      document.getElementById('profile-pic').src = publicUrl;
    });

    function editProfile() {
      window.location.href = 'edit-profile.html';
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    loadProfile();
    loadVideos();
  </script>
</body>
</html>
