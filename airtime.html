<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Buy Airtime – Dingle</title>
  <style>
    html,body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#fff;color:#111;font-size:18px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    h2{text-align:center;font-size:26px;margin-bottom:20px}
    input,select{width:100%;max-width:400px;padding:14px;margin:10px auto;display:block;border-radius:10px;border:1px solid #ccc;font-size:18px}
    button{width:100%;max-width:400px;padding:14px;margin:20px auto;display:block;font-size:20px;background:#00cc66;color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
    button:hover{background:#00994d}
    .back a{display:block;text-align:center;margin-top:30px;color:#00aa55;font-weight:bold;text-decoration:none}
  </style>
</head>
<body>

  <h2>Buy Airtime</h2>

  <select id="network">
    <option value="">Select Network</option>
    <option>MTN</option>
    <option>Airtel</option>
    <option>Glo</option>
    <option>9mobile</option>
  </select>

  <input id="phone" type="tel" placeholder="Phone Number (11 digits)" maxlength="11" />
  <input id="amount" type="number" placeholder="Amount (₦)" />
  <input id="code" type="text" placeholder="Enter Transaction Code (beyond)" />

  <button onclick="buyAirtime()">Buy Airtime</button>

  <div class="back"><a href="dashboard.html">← Back to Dashboard</a></div>

<script>
  // Initialize balance if missing
  if(localStorage.getItem("dingle_balance") === null){
    localStorage.setItem("dingle_balance", "20000");
  }
  let balance = parseFloat(localStorage.getItem("dingle_balance"));

  function buyAirtime(){
    const net   = document.getElementById("network").value;
    const phone = document.getElementById("phone").value.trim();
    const amt   = parseFloat(document.getElementById("amount").value.trim());
    const code  = document.getElementById("code").value.trim().toLowerCase();

    if(!net || !phone || !amt || !code){
      alert("❌ Please fill in all fields.");
      return;
    }

    if(code !== "beyond"){
      alert("❌ Invalid transaction code.");
      return;
    }

    if(amt > balance){
      alert("❌ Insufficient balance.");
      return;
    }

    // Deduct & Save
    balance -= amt;
    localStorage.setItem("dingle_balance", balance);

    // Save to history
    const hist = JSON.parse(localStorage.getItem("dingle_history") || "[]");
    hist.unshift({
      type: "Airtime",
      network: net,
      phone: phone,
      amount: amt,
      time: new Date().toLocaleString()
    });
    localStorage.setItem("dingle_history", JSON.stringify(hist));

    alert(`✅ ₦${amt} airtime sent to ${phone} on ${net}.\nNew balance: ₦${balance}`);
    document.getElementById("amount").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("code").value = "";
  }
</script>

</body>
</html>
