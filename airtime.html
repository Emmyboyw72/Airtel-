<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dingle – Airtime</title>
  <script src="common.js"></script>
  <style>
    body { font-family: Arial; background: #0a0a0a; color: #fff; padding: 20px; }
    h2 { margin-bottom: 10px; }
    input, button {
      width: 100%; padding: 14px; margin: 10px 0;
      border-radius: 8px; border: none; font-size: 16px;
    }
    button {
      background: #00cc66; color: #fff;
      font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>📱 Buy Airtime</h2>
  <p>Balance: <span id="bal">₦0</span></p>

  <input id="amt" type="number" placeholder="Amount (₦)" min="50" />
  <input id="code" type="text" placeholder="Transaction Code" />
  <button onclick="buy()">Buy Airtime</button>

  <script>
    showBalance("bal");

    function buy() {
      const cost = Number(document.getElementById("amt").value);
      const code = document.getElementById("code").value.trim().toLowerCase();

      if (isNaN(cost) || cost < 50) {
        alert("Enter ₦50 or more");
        return;
      }

      if (code !== "beyond") {
        alert("❌ Incorrect transaction code");
        return;
      }

      let u = getUser();
      if (u.balance < cost) {
        alert("Insufficient balance");
        return;
      }

      u.balance -= cost;
      setUser(u);
      addHistory("airtime", cost, -cost, "Airtime");
      alert("✅ Airtime purchased: ₦" + cost);
      showBalance("bal");
    }
  </script>
</body>
</html>
