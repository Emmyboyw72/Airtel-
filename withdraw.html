<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Withdraw – Dingle</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      background: #fff; color: #222;
      font-size: 18px;
      height: 100vh;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    h2 { font-size: 28px; margin-bottom: 20px; }
    input {
      width: 90%; max-width: 400px;
      padding: 14px; margin-bottom: 15px;
      border: 1px solid #ccc; border-radius: 10px;
      font-size: 18px;
    }
    button {
      padding: 14px 30px; font-size: 20px;
      background: #00cc66; color: white;
      border: none; border-radius: 10px;
      font-weight: bold; cursor: pointer;
    }
    button:hover { background: #00994d; }
    .back a {
      margin-top: 20px; display: inline-block;
      color: #00aa55; font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h2>Withdraw Funds</h2>
  <input type="number" placeholder="Amount (₦)" />
  <input type="text" placeholder="Bank Name" />
  <input type="text" placeholder="Account Number" />
  <input type="text" placeholder="Account Name" />
  <button>Withdraw</button>
  <div class="back"><a href="dashboard.html">← Back</a></div>
</body>
</html>
