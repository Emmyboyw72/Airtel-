<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Withdraw – Dingle</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #fff; font-size: 18px; }
    h2 { text-align: center; font-size: 26px; margin-bottom: 20px; }
    input, button {
      width: 100%; max-width: 400px; padding: 14px; margin: 10px auto;
      display: block; border-radius: 10px; font-size: 18px; border: 1px solid #ccc;
    }
    button {
      background: #00cc66; color: #fff; font-weight: bold; border: none; cursor: pointer;
    }
    button:hover { background: #00994d; }
    .back a {
      display: block; text-align: center; margin-top: 25px;
      color: #00aa55; font-weight: bold; text-decoration: none;
    }
  </style>
</head>
<body>

<h2>Withdraw Funds</h2>

<input id="bank"    placeholder="Bank Name" />
<input id="account" type="number" placeholder="Account Number" maxlength="10" />
<input id="amount"  type="number" placeholder="Amount (₦)" />
<input id="code"    placeholder="Enter Dingle Code" />

<button onclick="withdraw()">Withdraw Now</button>

<div class="back"><a href="dashboard.html">← Back to Dashboard</a></div>

<script>
const CODE = "beyond";
if (localStorage.getItem("dingle_balance") === null) {
  localStorage.setItem("dingle_balance", "20000");
}

function withdraw() {
  const bank = document.getElementById("bank").value.trim();
  const acct = document.getElementById("account").value.trim();
  const amt = parseFloat(document.getElementById("amount").value.trim());
  const code = document.getElementById("code").value.trim().toLowerCase();

  if (!bank || !acct || !amt || !code) {
    alert("❌ Fill all fields");
    return;
  }
  if (acct.length < 10 || isNaN(acct)) {
    alert("❌ Invalid account");
    return;
  }
  if (code !== CODE) {
    alert("❌ Incorrect Dingle Code");
    return;
  }

  let bal = parseFloat(localStorage.getItem("dingle_balance"));
  if (amt > bal) {
    alert("❌ Insufficient balance");
    return;
  }

  bal -= amt;
  localStorage.setItem("dingle_balance", bal);

  const h = JSON.parse(localStorage.getItem("dingle_history") || "[]");
  h.unshift({
    type: "Withdraw",
    bank,
    account: acct,
    amount: amt,
    time: new Date().toLocaleString()
  });
  localStorage.setItem("dingle_history", JSON.stringify(h));

  alert(`✅ ₦${amt} sent to ${acct}\nNew balance: ₦${bal}`);
  document.querySelectorAll("input").forEach(i => i.value = "");
}
</script>

</body>
</html>
