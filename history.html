<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Transaction History – Dingle</title>
  <style>
    html, body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      font-size: 18px;
    }
    h2 {
      text-align: center;
      font-size: 26px;
      margin-bottom: 20px;
    }
    .item {
      background: #fff;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,.1);
    }
    .type {
      font-weight: bold;
    }
    .back a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #00aa55;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>

<h2>Transaction History</h2>
<div id="list"></div>
<div class="back"><a href="dashboard.html">← Back to Dashboard</a></div>

<script>
  const list = document.getElementById("list");
  const hist = JSON.parse(localStorage.getItem("dingle_history") || "[]");

  if (hist.length === 0) {
    list.innerHTML = "<p style='text-align:center'>No transactions yet.</p>";
  } else {
    hist.forEach(rec => {
      const div = document.createElement("div");
      div.className = "item";

      let info = `<span class="type">${rec.type}</span> – ₦${rec.amount}<br>`;
      if (rec.type === "Airtime") {
        info += `${rec.network} - ${rec.phone}<br>`;
      } else if (rec.type === "Data") {
        info += `${rec.network} - ${rec.bundle} - ${rec.phone}<br>`;
      } else if (rec.type === "Withdraw") {
        info += `${rec.bank} - ${rec.account}<br>`;
      }

      info += `<small>${rec.time}</small>`;
      div.innerHTML = info;
      list.appendChild(div);
    });
  }
</script>

</body>
</html>
