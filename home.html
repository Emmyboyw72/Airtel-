<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social App Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: sans-serif;
    }
    body {
      background: #0d0d0d;
      color: white;
      overflow-x: hidden;
    }

    header {
      background: #1a1a1a;
      padding: 10px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .top-bar i {
      color: white;
      font-size: 20px;
      margin: 0 10px;
      cursor: pointer;
    }

    .header-buttons {
      display: flex;
      justify-content: space-around;
      background: #111;
      padding: 10px 0;
      border-top: 1px solid #333;
    }

    .header-buttons button {
      background: none;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .post-box {
      display: flex;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #333;
    }

    .post-box img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .post-box input {
      flex: 1;
      background: #222;
      border: none;
      padding: 10px;
      border-radius: 20px;
      color: white;
    }

    .story-box {
      display: flex;
      padding: 10px;
      overflow-x: auto;
    }

    .story {
      min-width: 80px;
      height: 130px;
      background: #222;
      border-radius: 10px;
      margin-right: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      position: relative;
    }

    .story i {
      background: #007bff;
      border-radius: 50%;
      padding: 5px;
      margin-bottom: 5px;
    }

    .feed {
      margin-top: 10px;
    }

    .video-post {
      width: 100vw;
      height: 90vh;
      position: relative;
    }

    .video-post video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-reactions {
      position: absolute;
      right: 10px;
      bottom: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .video-reactions i {
      font-size: 24px;
      margin: 10px 0;
      cursor: pointer;
    }

    .comments-section {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      max-height: 50%;
      overflow-y: auto;
    }

    .comment {
      padding: 10px;
      border-bottom: 1px solid #333;
    }

    .comment input {
      width: 100%;
      background: #333;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
    }

  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div>
        <i class="fas fa-search" onclick="navigate('search.html')"></i>
      </div>
      <div>
        <i class="fas fa-comment-dots" onclick="navigate('messages.html')"></i>
        <i class="fas fa-bars" onclick="navigate('menu.html')"></i>
      </div>
    </div>
  </header>

  <div class="header-buttons">
    <button onclick="navigate('home.html')">Home</button>
    <button onclick="navigate('market.html')">Market</button>
    <button onclick="navigate('friends.html')">Friends</button>
    <button onclick="navigate('notifications.html')">Notifications</button>
    <button onclick="navigate('profile.html')">Profile</button>
  </div>

  <div class="post-box">
    <img src="user.jpg" alt="User Profile" onclick="navigate('profile.html')">
    <input type="text" placeholder="What's on your mind?">
    <i class="fas fa-image" style="margin-left:10px;" onclick="navigate('upload.html')"></i>
  </div>

  <div class="story-box">
    <div class="story" onclick="navigate('add-story.html')">
      <i class="fas fa-plus"></i>
      <span>Add Story</span>
    </div>
    <div class="story">
      <img src="story1.jpg" alt="" style="width: 100%; height: 100%; border-radius: 10px;">
    </div>
  </div>

  <div class="feed">
    <div class="video-post">
      <video src="video1.mp4" controls autoplay muted loop></video>
      <div class="video-reactions">
        <i class="fas fa-thumbs-up"></i>
        <i class="fas fa-comment"></i>
        <i class="fas fa-share"></i>
      </div>
    </div>
  </div>

  <script>
    function navigate(page) {
      window.location.href = page;
    }
  </script>
</body>
</html>
