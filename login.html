<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Login – Dingle</title>

  <style>
    html,body{
      margin:0;padding:0;width:100vw;height:100vh;
      font-family:Arial,sans-serif;background:#ffffff;color:#222;
      -webkit-text-size-adjust:100%;text-size-adjust:100%;
      overflow:hidden;font-size:18px;
    }
    .container{
      height:100%;display:flex;flex-direction:column;
      justify-content:center;align-items:center;padding:20px;text-align:center;
    }
    h2{font-size:28px;margin-bottom:20px}
    input{
      width:90%;max-width:350px;padding:12px;font-size:18px;
      margin-bottom:15px;border:1px solid #ccc;border-radius:8px
    }
    button{
      padding:12px 24px;font-size:18px;background:#004d00;color:#fff;
      border:none;border-radius:8px;font-weight:bold;cursor:pointer
    }
    button:hover{background:#006600}
  </style>
</head>

<body>
  <div class="container">
    <h2>Login to Dingle</h2>

    <!-- phone number -->
    <input type="tel" id="phone" placeholder="11-digit Phone Number" />

    <!-- password -->
    <input type="password" id="password" placeholder="Password" />

    <button onclick="login()">Login</button>
  </div>

  <script>
    function login(){
      const phone   = document.getElementById('phone').value.trim();
      const passIn  = document.getElementById('password').value.trim();

      const savedPhone = localStorage.getItem('dingle_phone');
      const savedPass  = localStorage.getItem('dingle_password');

      // basic checks
      if(!/^\d{11}$/.test(phone)){
        alert('Phone number must be exactly 11 digits'); return;
      }
      if(passIn.length < 4){
        alert('Password must be at least 4 characters'); return;
      }

      // verify
      if(phone === savedPhone && passIn === savedPass){
        localStorage.setItem('dingle_loggedIn','true');
        window.location.href = 'dashboard.html';
      }else{
        alert('Incorrect phone number or password');
      }
    }
  </script>
</body>
</html>
