<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Login – Dingle</title>
  <script src="common.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
      font-size: 18px;
    }
    h2 {
      text-align: center;
    }
    input, button {
      width: 100%;
      max-width: 400px;
      padding: 14px;
      margin: 10px auto;
      display: block;
      border-radius: 10px;
      font-size: 18px;
      border: 1px solid #ccc;
    }
    button {
      background: #00cc66;
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #00994d;
    }
    .link {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h2>Login</h2>

  <input id="phone" type="number" placeholder="Phone (11 digits)" />
  <input id="pass"  type="password" placeholder="Password" />
  <button onclick="login()">Login</button>

  <div class="link">
    <a href="signup.html">Create account</a>
  </div>

  <script>
    window.onload = () => {
      const u = localStorage.getItem("dingle_logged_in");
      if (u && u !== "null") {
        try {
          const user = JSON.parse(u);
          if (user.phone && user.password) {
            location = "dashboard.html";
          }
        } catch (e) {}
      }
    };

    function login() {
      const phone = document.getElementById("phone").value.trim();
      const pass = document.getElementById("pass").value.trim();
      const u = JSON.parse(localStorage.getItem("dingle_user") || "null");

      if (!phone || !pass) {
        alert("❌ Fill in all fields");
        return;
      }
      if (phone.length !== 11 || isNaN(phone)) {
        alert("❌ Phone must be 11 digits");
        return;
      }
      if (!u || u.phone !== phone || u.password !== pass) {
        alert("❌ Incorrect phone or password");
        return;
      }

      localStorage.setItem("dingle_logged_in", JSON.stringify(u));
      alert("✅ Login successful!");
      location = "dashboard.html";
    }
  </script>

</body>
</html>
