<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Emmy Social</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 350px;
      text-align: center;
    }
    h2 {
      color: #1877f2;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #1877f2;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
    }
    .loader {
      height: 3px;
      width: 0%;
      background: #1877f2;
      position: fixed;
      top: 0;
      left: 0;
      animation: loading 2s linear forwards;
    }
    @keyframes loading {
      to {
        width: 100%;
      }
    }
    .link {
      margin-top: 10px;
      display: block;
      color: #1877f2;
      text-decoration: none;
      font-size: 14px;
    }
    .copyright {
      margin-top: 20px;
      font-size: 11px;
      color: gray;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login to Emmy</h2>
    <input type="email" id="email" placeholder="Email or Phone" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <a href="signup.html" class="link">Don't have an account? Sign up</a>
    <div class="copyright">© 2025 Emmy Ltd. United Kingdom</div>
    <div id="loader" class="loader" style="display: none;"></div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = 'https://jjbxaoorxwomaudjrfwt.supabase.co';
    const supabaseKey = 'YOUR_SUPABASE_ANON_KEY'; // Replace with your anon key
    const supabase = createClient(supabaseUrl, supabaseKey);

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      document.getElementById('loader').style.display = 'block';

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password,
      });

      if (error) {
        alert("Login failed: " + error.message);
        document.getElementById('loader').style.display = 'none';
      } else {
        // redirect to home
        setTimeout(() => {
          window.location.href = "home.html";
        }, 1500);
      }
    }
  </script>
</body>
</html>
