<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Dingle</title>
  <style>
    body {font-family:Arial;padding:20px;background:#f4f4f4;font-size:18px}
    h2  {text-align:center}
    input,button{
      width:100%;max-width:400px;padding:14px;margin:10px auto;display:block;
      border-radius:10px;font-size:18px;border:1px solid #ccc
    }
    button{background:#00cc66;color:#fff;font-weight:bold;border:none;cursor:pointer}
    button:hover{background:#00994d}
    .link{text-align:center;margin-top:15px}
  </style>
</head>
<body>

<h2>Login</h2>

<input id="phone" type="number"   placeholder="Phone (11 digits)" />
<input id="pass"  type="password" placeholder="Password" />

<button onclick="login()">Login</button>
<div class="link"><a href="signup.html">Don't have an account? Sign up</a></div>

<script>
const PROFILE_KEY = "dingle_user";
const LOGIN_KEY   = "dingle_logged_in";

// Auto-redirect to dashboard if already logged in
window.onload = () => {
  if (localStorage.getItem(LOGIN_KEY)) {
    window.location.href = "dashboard.html";
  }
};

function login(){
  const phone = document.getElementById("phone").value.trim();
  const pwd   = document.getElementById("pass").value.trim();

  if(!phone||!pwd){alert("❌ All fields required");return;}
  if(phone.length!==11 || isNaN(phone)){alert("❌ Phone must be 11 digits");return;}

  const user = JSON.parse(localStorage.getItem(PROFILE_KEY)||"null");

  if(!user || user.phone !== phone || user.password !== pwd){
    alert("❌ Incorrect phone number or password");
    return;
  }

  localStorage.setItem(LOGIN_KEY, JSON.stringify(user));
  window.location.href = "dashboard.html";
}
</script>
</body>
</html>
