<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – Glovo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #e50914; /* Glovo red */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            color: #333;
        }

        .login-container::before {
            content: "🍛";
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 32px;
            opacity: 0.9;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #e50914;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #e50914;
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            margin: 15px 0;
        }

        .checkbox-group input {
            width: auto;
            margin-right: 10px;
            margin-top: 4px;
        }

        .checkbox-group label {
            font-weight: normal;
            color: #555;
            font-size: 14px;
        }

        .checkbox-group a {
            color: #e50914;
            text-decoration: none;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-login:hover {
            background: #c20710;
        }

        .btn-login i {
            font-size: 20px;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 15px;
            color: #555;
        }

        .signup-link a {
            color: #e50914;
            text-decoration: none;
            font-weight: bold;
        }

        /* Alert */
        .alert {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            padding: 20px 28px;
            border-radius: 16px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            opacity: 0;
            transition: transform 0.4s ease, opacity 0.4s ease;
            text-align: center;
            max-width: 90%;
            background: #00c853;
        }

        .alert.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .alert-error {
            background: #d32f2f;
        }

        .alert-title {
            display: block;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .alert-icon {
            font-size: 32px;
            margin-bottom: 8px;
            display: block;
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Welcome Back</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Gmail</label>
                <input type="email" id="email" required placeholder="you@gmail.com" />
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required minlength="6" placeholder="••••••" />
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required />
                <label for="terms">
                    I agree to Glovo's <a href="#" target="_blank">Terms & Conditions</a>
                </label>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-utensils"></i> Log In
            </button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>

    <!-- Beautiful centered alert -->
    <div id="alert" class="alert">
        <span class="alert-icon">🍲</span>
        <span class="alert-title">Glovo</span>
        <span id="alert-message">Message here</span>
    </div>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        Logging in...
    </div>

    <!-- Firebase via CDN (no extra spaces!) -->
    <script type="module">
        // ✅ Fixed: Removed trailing spaces in URLs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyASOh_kA_d_L3T3L78Lvid0rjLKccKVFpw",
            authDomain: "glovo-a0ea4.firebaseapp.com",
            projectId: "glovo-a0ea4",
            storageBucket: "glovo-a0ea4.firebasestorage.app",
            messagingSenderId: "737022109409",
            appId: "1:737022109409:web:84a0966d3681f3960479a0",
            measurementId: "G-W2BMB39T29"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        function showAlert(message, isError = false) {
            const alertEl = document.getElementById('alert');
            document.getElementById('alert-message').textContent = message;
            alertEl.className = `alert ${isError ? 'alert-error' : ''} show`;
            setTimeout(() => {
                alertEl.classList.remove('show');
            }, 3000);
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const termsChecked = document.getElementById('terms').checked;

            if (!termsChecked) {
                showAlert("Please agree to the Terms & Conditions.", true);
                return;
            }

            if (!email || !password) {
                showAlert("Please fill in all fields.", true);
                return;
            }

            showLoading(true);

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                localStorage.setItem('isSignedIn', 'true');

                showAlert("Login successful! Redirecting to dashboard...");

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
            } catch (error) {
                console.error("Login error:", error.code, error.message);
                let msg = "Login failed. Please check your credentials.";

                if (error.code === 'auth/user-not-found') {
                    msg = "Gmail is not registered. Please sign up.";
                } else if (error.code === 'auth/wrong-password') {
                    msg = "Incorrect password.";
                } else if (error.code === 'auth/invalid-email') {
                    msg = "Invalid email address.";
                } else if (error.code === 'auth/too-many-requests') {
                    msg = "Too many login attempts. Try again later.";
                } else if (error.code === 'auth/network-request-failed') {
                    msg = "Network error. Please check your connection.";
                }

                showAlert(msg, true);
            } finally {
                showLoading(false);
            }
        });
    </script>
</body>
</html>
