<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Emmy</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e9eff6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      width: 300px;
    }
    h2 {
      text-align: center;
      color: #1877f2;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #1877f2;
      color: white;
      font-weight: bold;
    }
    .success {
      color: green;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
    }
    .error {
      color: red;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
    }
    .bottom-text {
      text-align: center;
      font-size: 14px;
      margin-top: 10px;
    }
    a {
      color: #1877f2;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Gmail">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="success" id="success"></div>
    <div class="error" id="error"></div>
    <div class="bottom-text">
      Don’t have an account? <a href="signup.html">Sign up</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDQKru9odtZHvGrFW376-KnBnCTmRWpuKQ",
      authDomain: "facebook-emmy.firebaseapp.com",
      projectId: "facebook-emmy",
      storageBucket: "facebook-emmy.appspot.com",
      messagingSenderId: "519581694556",
      appId: "1:519581694556:web:3799f1e7b983e89e8b4499"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.login = function () {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          document.getElementById('success').innerText = "Login successful! Redirecting...";
          document.getElementById('error').innerText = "";
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 2000);
        })
        .catch((error) => {
          document.getElementById('error').innerText = error.message;
          document.getElementById('success').innerText = "";
        });
    }
  </script>
</body>
</html>
