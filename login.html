<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Login - Dingle</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
      color: #222;
      font-size: 18px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding: 20px;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 28px;
    }

    input {
      padding: 12px;
      font-size: 18px;
      width: 90%;
      max-width: 350px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      background-color: #004d00;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #006600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login to Dingle</h2>
    <input type="email" placeholder="Email" />
    <input type="password" placeholder="Password" />
    <button onclick="window.location.href='dashboard.html'">Login</button>
  </div>
</body>
</html>
