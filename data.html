<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Data – Dingle</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #fff; font-size: 18px; }
    h2 { text-align: center }
    input, select, button {
      width: 100%; max-width: 400px; padding: 14px; margin: 10px auto;
      display: block; border-radius: 10px; font-size: 18px; border: 1px solid #ccc;
    }
    button {
      background: #00cc66; color: #fff; font-weight: bold; border: none; cursor: pointer;
    }
    button:hover { background: #00994d; }
  </style>
</head>
<body>

<h2>Buy Data</h2>

<select id="net">
  <option value="">Select Network</option>
  <option>MTN</option>
  <option>Airtel</option>
  <option>Glo</option>
  <option>9mobile</option>
</select>

<select id="bun">
  <option value="">Select Bundle</option>
  <option value="500MB-150">500MB – ₦150</option>
  <option value="1GB-250">1GB – ₦250</option>
  <option value="2GB-450">2GB – ₦450</option>
  <option value="5GB-1000">5GB – ₦1000</option>
</select>

<input id="num" type="number" placeholder="Phone number" />
<input id="code" placeholder="Enter Dingle Code" />

<button onclick="buy()">Buy Now</button>

<script>
const CODE = "beyond";

function buy() {
  const net = document.getElementById("net").value;
  const bun = document.getElementById("bun").value;
  const num = document.getElementById("num").value.trim();
  const code = document.getElementById("code").value.trim().toLowerCase();

  if (!net || !bun || !num || !code) {
    alert("❌ All fields required");
    return;
  }

  if (code !== CODE) {
    alert("❌ Incorrect Dingle Code");
    return;
  }

  const amt = parseInt(bun.split("-")[1]);
  const bundleName = bun.split("-")[0];
  let bal = parseFloat(localStorage.getItem("dingle_balance") || "20000");

  if (amt > bal) {
    alert("❌ Not enough balance");
    return;
  }

  bal -= amt;
  localStorage.setItem("dingle_balance", bal);

  const h = JSON.parse(localStorage.getItem("dingle_history") || "[]");
  h.unshift({
    type: "Data",
    network: net,
    phone: num,
    bundle: bundleName,
    amount: amt,
    time: new Date().toLocaleString()
  });
  localStorage.setItem("dingle_history", JSON.stringify(h));

  alert(`✅ ${bundleName} sent to ${num}\nNew balance: ₦${bal}`);
  document.querySelectorAll("input").forEach(i => i.value = "");
  document.getElementById("net").selectedIndex = 0;
  document.getElementById("bun").selectedIndex = 0;
}
</script>

</body>
</html>
