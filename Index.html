<!DOCTYPE html>
<html>
<head>
  <title>Airtel App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    body {
      background-color: #d90000;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100vh;
      color: #ffffff;
    }

    .logo {
      width: 120px;
      margin: 0 auto 15px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- YOUR LOGO -->
  <img src="your-logo.png" class="logo" alt="Logo">

  <!-- App Title -->
  <h1>my Airtel</h1>

  <!-- Footer -->
  <div class="footer">Powered by Airtel</div>

  <!-- Auto Redirect -->
  <script>
    setTimeout(() => {
      const user = localStorage.getItem('user');
      if (user) {
        window.location.href = "login.html";
      } else {
        window.location.href = "signup.html";
      }
    }, 2500);
  </script>

</body>
</html>
