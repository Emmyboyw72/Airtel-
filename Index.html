<!DOCTYPE html>
<html>
<head>
  <title>Airtel App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    body {
      background-color: #d90000; /* Red background */
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100vh;
      color: #ffffff; /* White text */
    }

    .logo {
      width: 120px;
      margin: 0 auto 15px;
      animation: blink 2s infinite;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #ffffff;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  </style>
</head>
<body>

  <!-- Your Logo -->
  <img src="your-logo.png" class="logo" alt="Logo">

  <!-- App Title -->
  <h1>my Airtel</h1>

  <!-- Footer -->
  <div class="footer">Powered by Airtel</div>

  <!-- Auto Redirect Script -->
  <script>
    setTimeout(() => {
      const user = localStorage.getItem('user');
      try {
        const parsed = JSON.parse(user);
        // If user exists and has balance or name, go to login
        if (parsed && parsed.name) {
          window.location.href = "login.html";
        } else {
          window.location.href = "signup.html";
        }
      } catch (e) {
        // In case of broken localStorage
        window.location.href = "signup.html";
      }
    }, 2500); // 2.5 seconds delay
  </script>

</body>
</html>
