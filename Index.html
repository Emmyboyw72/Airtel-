<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #1877f2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .logo {
      font-size: 100px;
      font-weight: bold;
      margin-bottom: 40px;
    }

    .dots {
      display: flex;
      gap: 10px;
      margin-bottom: 60px;
    }

    .dot {
      width: 12px;
      height: 12px;
      background-color: #1877f2;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    .dot:nth-child(3) {
      animation-delay: 0;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0);
      }
      40% {
        transform: scale(1);
      }
    }

    .meta {
      position: absolute;
      bottom: 30px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="logo">E</div>

  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="meta">from Meta</div>

  <script>
    setTimeout(() => {
      const user = localStorage.getItem("user");
      if (user) {
        window.location.href = "home.html"; // Already signed in
      } else {
        window.location.href = "signup.html"; // Not signed up yet
      }
    }, 3000);
  </script>
</body>
</html>
