<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Signup – Dingle</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
      font-size: 18px;
    }
    h2 {
      text-align: center;
    }
    input, button {
      width: 100%;
      max-width: 400px;
      padding: 14px;
      margin: 10px auto;
      display: block;
      border-radius: 10px;
      font-size: 18px;
      border: 1px solid #ccc;
    }
    button {
      background: #00cc66;
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #00994d;
    }
    .link {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<h2>Create Account</h2>

<input id="username" placeholder="Full Name" />
<input id="email"    type="email" placeholder="Gmail (must end with @gmail.com)" />
<input id="phone"    type="number" placeholder="Phone (11 digits)" />
<input id="pass"     type="password" placeholder="Password (≥4 chars)" />

<button onclick="signup()">Sign Up</button>

<div class="link"><a href="login.html">Already have an account? Login</a></div>

<script>
  function signup() {
    const n  = document.getElementById("username").value.trim();
    const e  = document.getElementById("email").value.trim();
    const p  = document.getElementById("phone").value.trim();
    const pw = document.getElementById("pass").value.trim();

    if (!n || !e || !p || !pw) {
      alert("❌ All fields are required");
      return;
    }
    if (!e.endsWith("@gmail.com")) {
      alert("❌ Must use Gmail");
      return;
    }
    if (p.length !== 11 || isNaN(p)) {
      alert("❌ Phone must be 11 digits");
      return;
    }
    if (pw.length < 4) {
      alert("❌ Password too short");
      return;
    }

    let users = JSON.parse(localStorage.getItem("dingle_users") || "[]");

    // Check for duplicates
    if (users.some(u => u.phone === p || u.email === e)) {
      alert("❌ Phone or Gmail already registered");
      return;
    }

    // Allow only 2 accounts
    if (users.length >= 2) {
      alert("❌ Only 2 accounts allowed per device");
      return;
    }

    const newUser = {
      name: n,
      email: e,
      phone: p,
      password: pw,
      balance: 20000
    };

    users.push(newUser);
    localStorage.setItem("dingle_users", JSON.stringify(users));

    alert("✅ Signup successful! Please login.");
    location.href = "login.html";
  }
</script>

</body>
</html>
