<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up – Glovo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #e50914;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .signup-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            color: #333;
        }

        .signup-container::before {
            content: "🍲";
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 32px;
            opacity: 0.9;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #e50914;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #e50914;
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            margin: 15px 0;
        }

        .checkbox-group input {
            width: auto;
            margin-right: 10px;
            margin-top: 4px;
        }

        .checkbox-group label {
            font-weight: normal;
            color: #555;
            font-size: 14px;
        }

        .checkbox-group a {
            color: #e50914;
            text-decoration: none;
        }

        .btn-signup {
            width: 100%;
            padding: 14px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-signup:hover {
            background: #c20710;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 15px;
            color: #555;
        }

        .login-link a {
            color: #e50914;
            text-decoration: none;
            font-weight: bold;
        }

        /* Beautiful Alert */
        .alert {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            padding: 20px 28px;
            border-radius: 16px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            opacity: 0;
            transition: transform 0.4s ease, opacity 0.4s ease;
            text-align: center;
            max-width: 90%;
            background: #00c853;
        }

        .alert.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .alert-error {
            background: #d32f2f;
        }

        /* Food Loader */
        #foodLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #e50914;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
        }

        .loader-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce 1.2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .loader-text {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            max-width: 80%;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2>Join Glovo</h2>
        <form id="signupForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" required minlength="3" placeholder="e.g. foodlover123" />
            </div>

            <div class="input-group">
                <label for="email">Gmail</label>
                <input type="email" id="email" required placeholder="you@gmail.com" />
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required minlength="6" placeholder="••••••" />
            </div>

            <div class="input-group">
                <label for="address">Full Address</label>
                <input type="text" id="address" required placeholder="123 Main St, City" />
            </div>

            <div class="input-group">
                <label for="age">Age</label>
                <input type="number" id="age" required min="13" max="100" placeholder="18" />
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="+1 234 567 890" />
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required />
                <label for="terms">
                    I agree to Glovo's <a href="#" target="_blank">Terms & Conditions</a>
                </label>
            </div>

            <button type="submit" class="btn-signup">
                <i class="fas fa-utensils"></i> Sign Up
            </button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>

    <!-- Beautiful Alert -->
    <div id="alert" class="alert">
        <span id="alert-message">Signing up...</span>
    </div>

    <!-- Food Loader -->
    <div id="foodLoader">
        <div class="loader-icon">🍲</div>
        <div class="loader-text">Creating your account...</div>
    </div>

    <script type="module">
        // ✅ FIXED: Removed trailing spaces in CDN URLs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyASOh_kA_d_L3T3L78Lvid0rjLKccKVFpw",
            authDomain: "glovo-a0ea4.firebaseapp.com",
            projectId: "glovo-a0ea4",
            storageBucket: "glovo-a0ea4.firebasestorage.app",
            messagingSenderId: "737022109409",
            appId: "1:737022109409:web:84a0966d3681f3960479a0",
            measurementId: "G-W2BMB39T29"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function showAlert(message, isError = false) {
            const alertEl = document.getElementById('alert');
            document.getElementById('alert-message').textContent = message;
            alertEl.className = `alert ${isError ? 'alert-error' : ''} show`;
            setTimeout(() => {
                alertEl.classList.remove('show');
            }, 3000);
        }

        function showLoader(show) {
            document.getElementById('foodLoader').style.display = show ? 'flex' : 'none';
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const address = document.getElementById('address').value.trim();
            const age = parseInt(document.getElementById('age').value);
            const phone = document.getElementById('phone').value.trim();

            if (!document.getElementById('terms').checked) {
                showAlert("Please agree to the Terms & Conditions.", true);
                return;
            }

            if (!username || !email || !password || !address || !age || !phone) {
                showAlert("Please fill in all fields.", true);
                return;
            }

            if (username.length < 3) {
                showAlert("Username must be at least 3 characters.", true);
                return;
            }

            showLoader(true);

            try {
                // 🔥 Create user WITHOUT email verification
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 💾 Save full profile to Firestore
                await setDoc(doc(db, 'users', user.uid), {
                    username: username,
                    email: email,
                    phone: phone,
                    address: address,
                    age: age,
                    createdAt: new Date()
                });

                // ✅ Success alert
                showAlert("Account created successfully! 🎉");

                // 🔄 Redirect to login after 1.5s
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (error) {
                let msg = "Signup failed. Please try again.";
                if (error.code === 'auth/email-already-in-use') {
                    msg = "This Gmail is already registered.";
                } else if (error.code === 'auth/invalid-email') {
                    msg = "Invalid Gmail address.";
                } else if (error.code === 'auth/weak-password') {
                    msg = "Password must be at least 6 characters.";
                }
                showAlert(msg, true);
                showLoader(false);
            }
        });
    </script>
</body>
</html>
