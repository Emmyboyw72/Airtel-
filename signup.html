<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Signup – Dingle</title>
<style>
 body{font-family:Arial;padding:20px;background:#f4f4f4;font-size:18px}
 input,button{width:100%;max-width:400px;padding:14px;margin:10px auto;
  border-radius:10px;border:1px solid #ccc;font-size:18px}
 button{background:#00cc66;color:#fff;font-weight:bold;border:none;cursor:pointer}
 button:hover{background:#00994d}
 h2{text-align:center}
</style></head><body>
<h2>Create Account</h2>

<input id="username" placeholder="Full Name">
<input id="email" type="email" placeholder="Gmail (must end with @gmail.com)">
<input id="phone" type="number" placeholder="Phone (11 digits)">
<input id="pass" type="password" placeholder="Password (≥4 chars)">
<button onclick="signup()">Sign Up</button>
<div style="text-align:center"><a href="login.html">Already have an account? Login</a></div>

<script>
function signup(){
  const n=document.getElementById("username").value.trim();
  const e=document.getElementById("email").value.trim();
  const p=document.getElementById("phone").value.trim();
  const pw=document.getElementById("pass").value.trim();
  if(!n||!e||!p||!pw){alert("Fill all");return;}
  if(!e.endsWith("@gmail.com")){alert("Use Gmail only");return;}
  if(p.length!==11||isNaN(p)){alert("Phone must be 11 digits");return;}
  if(pw.length<4){alert("Password ≥4");return;}
  if(localStorage.getItem("dingle_user")){alert("One account per device");return;}

  const user={name:n,email:e,phone:p,password:pw,balance:20000};
  localStorage.setItem("dingle_user",JSON.stringify(user));
  alert("Signup success! Login now.");
  location="login.html";
}
</script></body></html>
