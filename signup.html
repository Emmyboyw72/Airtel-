<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Signup – Dingle</title>
  <style>
    body{font-family:Arial,sans-serif;padding:20px;background:#f6f6f6;font-size:18px}
    h2{text-align:center}
    input,button{width:100%;max-width:400px;padding:14px;margin:10px auto;
      display:block;border-radius:10px;font-size:18px;border:1px solid #ccc}
    button{background:#00cc66;color:#fff;font-weight:bold;border:none;cursor:pointer}
    button:hover{background:#00994d}
    .link{text-align:center;margin-top:15px}
  </style>
</head>
<body>

<h2>Create Account</h2>

<input id="username"   placeholder="Full Name" />
<input id="email"      type="email"  placeholder="Gmail (must be @gmail.com)" />
<input id="phone"      type="number" placeholder="Phone (11 digits)" />
<input id="pass"       type="password" placeholder="Password (≥4 chars)" />
<input id="code"       placeholder="Enter Dingle Code" />

<button onclick="signup()">Sign Up</button>
<div class="link"><a href="login.html">Have an account? Login</a></div>

<script>
const REQUIRED_CODE="dinglecooperative";

function signup(){
  const name=document.getElementById("username").value.trim();
  const email=document.getElementById("email").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const pass=document.getElementById("pass").value.trim();
  const code=document.getElementById("code").value.trim().toLowerCase();

  if(!name||!email||!phone||!pass||!code){alert("❌ All fields required");return;}
  if(!email.endsWith("@gmail.com")){alert("❌ Must use Gmail");return;}
  if(phone.length!==11||isNaN(phone)){alert("❌ Phone must be 11 digits");return;}
  if(pass.length<4){alert("❌ Password too short");return;}
  if(code!==REQUIRED_CODE){alert("❌ Incorrect Dingle Code");return;}

  const users=JSON.parse(localStorage.getItem("dingle_users")||"[]");
  if(users.some(u=>u.phone===phone||u.email===email)){
    alert("❌ Phone or Gmail already registered");return;
  }

  users.push({name,email,phone,pass});
  localStorage.setItem("dingle_users",JSON.stringify(users));
  localStorage.setItem("dingle_login",phone);
  localStorage.setItem("dingle_balance","20000");

  alert("✅ Signup successful! Welcome "+name);
  window.location.href="dashboard.html";
}
</script>
</body>
</html>
