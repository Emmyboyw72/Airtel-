<!-- signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup – Dingle</title>
  <style>
    body {font-family:Arial;padding:20px;background:#f4f4f4;font-size:18px}
    h2  {text-align:center}
    input,button{
      width:100%;max-width:400px;padding:14px;margin:10px auto;display:block;
      border-radius:10px;font-size:18px;border:1px solid #ccc
    }
    button{
      background:#00cc66;color:#fff;font-weight:bold;border:none;cursor:pointer
    }
    button:hover{background:#00994d}
    .link{text-align:center;margin-top:15px}
  </style>
</head>
<body>

<h2>Create Account</h2>

<input id="username" placeholder="Full Name" />
<input id="email"    type="email"  placeholder="Gmail (must end with @gmail.com)" />
<input id="phone"    type="number" placeholder="Phone (11 digits)" />
<input id="pass"     type="password" placeholder="Password (≥4 chars)" />

<button onclick="signup()">Sign Up</button>
<div class="link"><a href="login.html">Already have an account? Login</a></div>

<script>
const PROFILE_KEY = "dingle_user";

function signup(){
  const name  = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const pwd   = document.getElementById("pass").value.trim();

  if(!name||!email||!phone||!pwd){alert("❌ All fields required");return;}
  if(!email.endsWith("@gmail.com")){alert("❌ Must use Gmail");return;}
  if(phone.length!==11 || isNaN(phone)){alert("❌ Phone must be 11 digits");return;}
  if(pwd.length<4){alert("❌ Password too short");return;}
  if(localStorage.getItem(PROFILE_KEY)){alert("❌ Only one account allowed on this device");return;}

  const user={name,email,phone,password:pwd,balance:20000};
  localStorage.setItem(PROFILE_KEY, JSON.stringify(user));
  alert("✅ Signup successful! Please login.");
  window.location.href = "login.html";
}
</script>
</body>
</html>
