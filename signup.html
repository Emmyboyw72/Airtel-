<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Signup – Dingle</title>
  <style>
    html,body{margin:0;padding:0;width:100vw;height:100vh;font-family:Arial,sans-serif;
      background:#f2f2f2;color:#222;font-size:18px;-webkit-text-size-adjust:100%;
      text-size-adjust:100%;overflow:hidden}
    .container{height:100%;display:flex;flex-direction:column;justify-content:center;
      align-items:center;padding:20px;text-align:center}
    h2{font-size:28px;margin-bottom:20px}
    input{width:90%;max-width:350px;padding:12px;font-size:18px;margin-bottom:15px;
      border:1px solid #ccc;border-radius:8px}
    button{padding:12px 24px;font-size:18px;background:#00cc66;color:#fff;border:none;
      border-radius:8px;font-weight:bold;cursor:pointer}
    button:hover{background:#00b359}
    .login-link{margin-top:15px;font-size:16px}
    .login-link a{color:#00aa55;font-weight:bold;text-decoration:none}
    .login-link a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="container">
    <h2>Create Account</h2>
    <input id="name"       type="text"     placeholder="Full Name" />
    <input id="email"      type="email"    placeholder="Gmail Address" />
    <input id="phone"      type="tel"      placeholder="11-digit Phone Number" />
    <input id="password"   type="password" placeholder="Password (min 4 chars)" />
    <input id="dingleCode" type="text"     placeholder="Enter Dingle Code" />
    <button onclick="signup()">Sign Up</button>
    <div class="login-link">Already have an account? <a href="login.html">Login</a></div>
  </div>

  <script>
    function signup(){
      const name  = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const phone = document.getElementById('phone').value.trim();
      const pass  = document.getElementById('password').value.trim();
      const code  = document.getElementById('dingleCode').value.trim().toLowerCase();

      if(code!=="dinglecooperative"){alert("Invalid Dingle Code.");return;}
      if(!name||!email||!phone||!pass){alert("All fields are required.");return;}
      if(!email.endsWith("@gmail.com")){alert("Email must be Gmail.");return;}
      if(!/^\d{11}$/.test(phone)){alert("Phone must be 11 digits.");return;}
      if(pass.length<4){alert("Password ≥ 4 chars.");return;}

      const used = JSON.parse(localStorage.getItem("dingle_usedPhones")||"[]");
      if(used.includes(phone)){alert("Phone already used.");return;}
      used.push(phone); localStorage.setItem("dingle_usedPhones",JSON.stringify(used));

      // save user
      localStorage.setItem("dingle_name", name);
      localStorage.setItem("dingle_email", email);
      localStorage.setItem("dingle_phone", phone);
      localStorage.setItem("dingle_password", pass);
      localStorage.setItem("dingle_balance", "20000");  // signup bonus
      localStorage.setItem("dingle_loggedIn","false");

      window.location.href="login.html";
    }
  </script>
</body>
</html>
