<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Signup – Dingle</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f4f4; font-size: 18px }
    h2 { text-align: center }
    input, button {
      width: 100%; max-width: 400px; padding: 14px;
      margin: 10px auto; display: block; border-radius: 10px;
      font-size: 18px;
    }
    button {
      background: #00cc66; color: white; border: none;
      font-weight: bold; cursor: pointer;
    }
    button:hover { background: #00994d }
    .link { text-align: center; margin-top: 15px }
  </style>
</head>
<body>

<h2>Signup</h2>

<input type="text" id="username" placeholder="Enter your name" />
<input type="email" id="email" placeholder="Gmail (must be @gmail.com)" />
<input type="number" id="phone" placeholder="Phone number (11 digits)" />
<input type="password" id="pass" placeholder="Password (4+ digits)" />

<button onclick="signup()">Create Account</button>
<div class="link"><a href="login.html">Already have an account? Login</a></div>

<script>
  function signup() {
    const name  = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const pass  = document.getElementById("pass").value.trim();
    const hiddenCode = "dinglecooperative"; // enforced secretly

    if (!name || !email || !phone || !pass) {
      alert("❌ All fields required"); return;
    }

    if (!email.endsWith("@gmail.com")) {
      alert("❌ Must be a Gmail"); return;
    }

    if (phone.length !== 11 || isNaN(phone)) {
      alert("❌ Phone must be 11 digits"); return;
    }

    if (pass.length < 4) {
      alert("❌ Password too short"); return;
    }

    // Check against hidden code
    if (hiddenCode !== "dinglecooperative") {
      alert("❌ Invalid code"); return;
    }

    const users = JSON.parse(localStorage.getItem("dingle_users") || "[]");
    const exists = users.find(u => u.phone === phone || u.email === email);
    if (exists) {
      alert("❌ Phone or Gmail already registered"); return;
    }

    users.push({ name, email, phone, pass });
    localStorage.setItem("dingle_users", JSON.stringify(users));
    localStorage.setItem("dingle_login", phone);
    localStorage.setItem("dingle_balance", "20000");

    alert("✅ Signup successful. Welcome " + name);
    window.location.href = "dashboard.html";
  }
</script>

</body>
</html>
