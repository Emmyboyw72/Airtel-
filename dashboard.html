<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dingle Dashboard</title>
<script src="common.js"></script>
<style>
 body{margin:0;font-family:Arial;background:#0a0a0a;color:#fff}
 .top{padding:20px}
 .balance-box{background:#00cc66;margin:10px;border-radius:15px;padding:20px;text-align:center}
 .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:20px}
 .btn{background:#1c1c1c;border:1px solid #333;border-radius:20px;padding:20px 10px;
  font-size:15px;font-weight:bold;color:#fff;text-decoration:none;display:block}
 .btn:hover{background:#2a2a2a}
 .full-row{grid-column:1/-1}
 .popup{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#00cc66;color:#fff;padding:15px 25px;border-radius:10px;font-weight:bold;
  animation:fade 5s forwards}@keyframes fade{0%,80%{opacity:1}100%{opacity:0;display:none}}
</style></head><body>
<div class="top"><h2>👋 Hi, <span id="userName">USER</span></h2></div>
<div class="balance-box"><span>Balance</span><h3 id="bal">₦0</h3></div>

<div class="grid">
  <a href="withdraw.html" class="btn full-row">💸 Withdraw</a>
  <a href="data.html"    class="btn">📡 Data</a>
  <a href="airtime.html" class="btn">📱 Airtime</a>
  <a href="game.html"    class="btn">🎮 Game</a>
  <a href="buycode.html" class="btn">💳 Buy Code</a>
  <a href="history.html" class="btn">📜 History</a>
  <a href="trade.html"   class="btn">📈 Trade</a>
</div>

<div class="popup" id="pop">🔥 Trade now!</div>

<script>
const u=getUser(); if(!u) location="login.html";
document.getElementById("userName").textContent=u.name.toUpperCase();
showBalance("bal");
setTimeout(()=>document.getElementById("pop").style.display="none",5000);
</script></body></html>
