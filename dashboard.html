<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dingle Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #e9ffe9;
    }

    .header {
      background: #00cc66;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 20px;
    }

    .balance-box {
      background: white;
      margin: 20px auto;
      padding: 20px;
      border-radius: 15px;
      max-width: 400px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 400px;
      margin: 0 auto 20px;
      padding: 0 10px;
    }

    .btn {
      background: white;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 0 8px rgba(0,0,0,0.05);
      cursor: pointer;
    }

    .btn:hover {
      background: #ccf5e7;
    }

    .logout-btn {
      display: block;
      width: 90%;
      margin: 20px auto;
      background: red;
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-weight: bold;
    }

    .logout-btn:hover {
      background: darkred;
    }
  </style>
</head>
<body>

<div class="header" id="greeting">Hi, User</div>

<div class="balance-box">
  Available Balance: ₦<span id="balance">20,000</span>
</div>

<div class="grid">
  <div class="btn" onclick="go('withdraw.html')">Withdraw</div>
  <div class="btn" onclick="go('airtime.html')">Airtime</div>
  <div class="btn" onclick="go('data.html')">Data</div>
  <div class="btn" onclick="go('trade.html')">Trade</div>
  <div class="btn" onclick="go('game.html')">Game</div>
  <div class="btn" onclick="go('buycode.html')">Buy Code</div>
</div>

<button class="logout-btn" onclick="logout()">Logout</button>

<script>
  const user = JSON.parse(localStorage.getItem("dingle_logged_in"));

  if (!user) {
    alert("⛔ Not logged in. Redirecting...");
    window.location.href = "login.html";
  } else {
    document.getElementById("greeting").textContent = `Hi, ${user.name}`;
    if (!user.balance) {
      user.balance = 20000;
      localStorage.setItem("dingle_logged_in", JSON.stringify(user));
    }
    document.getElementById("balance").textContent = user.balance.toLocaleString();
  }

  function go(page) {
    window.location.href = page;
  }

  function logout() {
    localStorage.removeItem("dingle_logged_in");
    alert("✅ Logged out");
    window.location.href = "login.html";
  }
</script>

</body>
</html>
