<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dingle Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }
    .top {
      padding: 20px;
    }
    .top h2 {
      margin-bottom: 10px;
    }
    .balance-box {
      background: #00cc66;
      border-radius: 15px;
      padding: 20px;
      margin: 10px;
      text-align: center;
    }
    .balance-box span {
      font-size: 16px;
      display: block;
    }
    .balance-box h3 {
      font-size: 28px;
      margin: 10px 0 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      padding: 20px;
    }
    .btn {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 20px;
      text-align: center;
      padding: 20px 10px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      text-decoration: none;
      box-shadow: 0 2px 5px #000;
    }
    .btn:hover {
      background: #2a2a2a;
    }
  </style>
</head>
<body>

<div class="top">
  <h2>👋 Hi, <span id="userName">User</span></h2>
</div>

<div class="balance-box">
  <span>Available Balance</span>
  <h3 id="balance">₦0.00</h3>
</div>

<div class="grid">
  <a href="withdraw.html" class="btn">💸 Withdraw</a>
  <a href="data.html" class="btn">📡 Data</a>
  <a href="airtime.html" class="btn">📱 Airtime</a>
  <a href="game.html" class="btn">🎮 Game</a>
  <a href="buycode.html" class="btn">💳 Buy Code</a>
  <a href="history.html" class="btn">📜 History</a>
</div>

<script>
  const user = JSON.parse(localStorage.getItem("dingle_logged_in") || "{}");
  document.getElementById("userName").textContent = user.name?.toUpperCase() || "USER";
  document.getElementById("balance").textContent = "₦" + (user.balance || 0).toLocaleString();
</script>

</body>
</html>
