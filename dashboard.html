<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Airtel Promo Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      overflow-x: hidden;
    }.background-logo {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 250px;
  transform: translate(-50%, -50%);
  z-index: -1;
  opacity: 0.07;
  filter: blur(5px);
  animation: blink 4s infinite ease-in-out;
}

@keyframes blink {
  0%, 100% { opacity: 0.07; }
  50% { opacity: 0.15; }
}

.header {
  background-color: #d90000;
  color: white;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.main-card {
  background: rgba(255, 255, 255, 0.9);
  margin: -20px 10px 10px;
  border-radius: 15px;
  box-shadow: 0 0 10px #ccc;
  padding: 20px;
}

.user-info {
  font-weight: bold;
  font-size: 16px;
}

.balance {
  font-size: 20px;
  margin-top: 10px;
}

.balance .eye {
  color: red;
  cursor: pointer;
  margin-left: 5px;
}

.buttons-row {
  display: flex;
  justify-content: space-around;
  margin-top: 15px;
}

.btn {
  background-color: #ffe5e5;
  border: 1px solid #ffcccc;
  color: #d90000;
  border-radius: 10px;
  padding: 10px;
  flex: 1;
  margin: 0 5px;
  text-align: center;
  font-size: 14px;
}

.banner, .promo {
  margin: 10px;
  border-radius: 10px;
  width: 95%;
}

.section {
  background: white;
  border-radius: 10px;
  margin: 10px;
  padding: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  text-align: center;
  font-size: 12px;
}

.grid div {
  padding: 10px;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
  font-size: 12px;
}

.promo-img {
  display: none;
  width: 100%;
}

  </style>
</head>
<body>  <!-- Background Blurred Logo -->  <img src="your-logo.png" alt="Airtel Logo" class="background-logo">  <div class="header">
    <div><b>Airtel Promo</b></div>
    <div>
      <img src="bell.png" alt="Bell" width="20">
    </div>
  </div>  <div class="main-card">
    <div class="user-info" id="userName">Loading...</div>
    <div id="userNumber">0000000000</div>
    <div class="balance">
      Account Balance: <span id="userBalance">₦0.00</span>
      <span class="eye">👁️</span>
    </div>
    <div class="buttons-row">
      <div class="btn">+ Add Money</div>
      <div class="btn">Withdraw Cash</div>
    </div>
  </div>  <img src="update-banner.png" class="banner" alt="Update Banner">
  <img src="promo-banner.png" class="promo-img" id="promoBanner" alt="Promo Banner">  <div class="section">
    <b>Transfer & Cashout</b>
    <div class="grid">
      <div>Transfer Money</div>
      <div>Add Money</div>
      <div>Withdraw Cash</div>
      <div>More Services</div>
    </div>
  </div>  <div class="section">
    <b>Recharge & Bill Payments</b>
    <div class="grid">
      <div>Recharge Airtime</div>
      <div>Buy Bundle</div>
      <div>Pay Bill</div>
      <div>Electricity</div>
    </div>
  </div>  <div class="bottom-nav">
    <div>🏠 Home</div>
    <div>📷 Scan</div>
    <div>📄 History</div>
    <div>☰ More</div>
  </div>  <script>
    const user = JSON.parse(localStorage.getItem('user')) || {};
    document.getElementById('userName').innerText = (user.name || 'USER').toUpperCase();
    document.getElementById('userNumber').innerText = user.phone || '08000000000';
    document.getElementById('userBalance').innerText = user.balance ? `₦${user.balance}` : '₦300.00';

    // Promo animation
    const promo = document.getElementById('promoBanner');
    setInterval(() => {
      promo.style.display = promo.style.display === 'none' ? 'block' : 'none';
    }, 5000);
  </script></body>
</html>
