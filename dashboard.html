<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dingle Dashboard</title>

  <!-- 🛡️ Block access if not logged in -->
  <script>
    if (localStorage.getItem("dingle_loggedIn") !== "true") {
      window.location.href = "login.html";
    }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      font-family: Arial, sans-serif;
      background-color: #004d00;
      color: white;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      font-size: 18px;
    }

    .container {
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    h1 {
      font-size: 28px;
      text-align: center;
      margin-bottom: 10px;
    }

    .balance {
      text-align: center;
      font-size: 22px;
      margin-bottom: 20px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 10px;
    }

    .btn {
      padding: 16px;
      background-color: #00cc66;
      border: none;
      color: white;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .btn:hover {
      background-color: #00b359;
    }

    .withdraw {
      grid-column: span 3;
      background-color: #ff6600;
    }

    .logout {
      background-color: #cc0000;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      color: white;
      width: 100%;
      max-width: 300px;
      margin: 30px auto 0;
      display: block;
    }

    .logout:hover {
      background-color: #b30000;
    }
  </style>
</head>

<body>
  <div class="container">
    <div>
      <h1>Welcome to Dingle</h1>
      <div class="balance">Balance: ₦20,000</div>

      <div class="buttons">
        <button class="btn withdraw">Withdraw</button>
        <button class="btn">Game</button>
        <button class="btn">Buy Code</button>
        <button class="btn">History</button>
        <button class="btn">Data</button>
        <button class="btn">Airtime</button>
        <button class="btn">Trade</button>
      </div>
    </div>

    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <script>
    function logout() {
      localStorage.setItem("dingle_loggedIn", "false");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
