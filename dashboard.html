<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dingle Dashboard</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .header {
      padding: 20px;
    }

    .header h2 {
      margin: 0;
      font-size: 20px;
    }

    .balance-box {
      background-color: #00c56f;
      border-radius: 14px;
      padding: 20px;
      margin: 15px;
      color: white;
    }

    .balance-box h3 {
      margin: 0;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }

    .balance-box .amount {
      font-size: 26px;
      font-weight: bold;
      margin-top: 10px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      padding: 0 15px 30px;
    }

    .btn {
      background-color: #1f1f1f;
      border-radius: 14px;
      padding: 20px 10px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: 0.2s;
    }

    .btn:hover {
      background-color: #333;
    }

    .logout {
      text-align: center;
      margin: 30px 0;
    }

    .logout button {
      background-color: #cc0000;
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .logout button:hover {
      background-color: #a30000;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>Hi, <span id="username">User</span> 👋</h2>
  </div>

  <div class="balance-box">
    <h3>
      <span>Available Balance</span>
      <span><a href="history.html" style="color: white; text-decoration: underline;">History</a></span>
    </h3>
    <div class="amount">₦0.00</div>
  </div>

  <div class="button-grid">
    <div class="btn" onclick="go('withdraw.html')">Withdraw</div>
    <div class="btn" onclick="go('game.html')">Game</div>
    <div class="btn" onclick="go('buycode.html')">Buy Code</div>
    <div class="btn" onclick="go('history.html')">History</div>
    <div class="btn" onclick="go('data.html')">Data</div>
    <div class="btn" onclick="go('airtime.html')">Airtime</div>
    <div class="btn" onclick="go('trade.html')">Trade</div>
  </div>

  <div class="logout">
    <button onclick="logout()">Logout</button>
  </div>

  <script>
    // Show name
    const name = localStorage.getItem("dingle_name") || "User";
    document.getElementById("username").innerText = name;

    // Route to page
    function go(page) {
      window.location.href = page;
    }

    // Logout function
    function logout() {
      localStorage.setItem("dingle_loggedIn", "false");
      window.location.href = "login.html";
    }

    // Show balance
    const balance = localStorage.getItem("dingle_balance") || "0";
    document.querySelector(".amount").innerText = "₦" + Number(balance).toLocaleString();
  </script>

</body>
</html>
