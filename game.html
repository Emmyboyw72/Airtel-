<!-- spin.html --><!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spin – Dingle</title>
  <style>
    body { background: #f9f9f9; font-family: Arial, sans-serif; padding: 20px; font-size: 18px; }
    h2 { text-align: center; color: #004d00; }
    .wheel {
      width: 300px; height: 300px; border: 10px solid #00cc66;
      border-radius: 50%; margin: 20px auto; position: relative;
      display: flex; align-items: center; justify-content: center;
      background: #fff;
    }
    .spin-btn {
      background: #00cc66; color: #fff; font-weight: bold;
      padding: 15px 30px; border: none; border-radius: 10px;
      font-size: 18px; cursor: pointer; display: block;
      margin: 20px auto;
    }
    .spin-btn:hover { background: #00994d; }
    .result { text-align: center; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>Spin & Win</h2>
  <div class="wheel">SPIN</div>
  <button class="spin-btn" onclick="spinWheel()">Spin Now (₦100)</button>
  <div class="result" id="result"></div><script>
if (localStorage.getItem("dingle_balance") === null) localStorage.setItem("dingle_balance", "20000");

function spinWheel() {
  let bal = parseFloat(localStorage.getItem("dingle_balance"));
  if (bal < 100) return alert("❌ Not enough balance");
  bal -= 100;
  const win = Math.floor(Math.random() * 5) * 100 + 100; // ₦100 – ₦500
  bal += win;
  localStorage.setItem("dingle_balance", bal);
  const history = JSON.parse(localStorage.getItem("dingle_history") || "[]");
  history.unshift({ type: "Spin", won: win, cost: 100, time: new Date().toLocaleString() });
  localStorage.setItem("dingle_history", JSON.stringify(history));
  document.getElementById("result").innerText = `🎉 You won ₦${win}! New Balance: ₦${bal}`;
}
</script></body>
</html><!-- game.html --><!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game – Dingle</title>
  <style>
    body { background: #f2f2f2; font-family: Arial, sans-serif; padding: 20px; font-size: 18px; }
    h2 { text-align: center; color: #004d00; }
    .btn {
      display: block; width: 100%; max-width: 400px; padding: 15px;
      margin: 15px auto; font-size: 20px; font-weight: bold;
      background: #00cc66; color: white; border: none; border-radius: 10px;
      cursor: pointer;
    }
    .btn:hover { background: #00994d; }
    .msg { text-align: center; margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Play & Earn</h2>
  <button class="btn" onclick="playGame()">Play Now (₦150)</button>
  <div class="msg" id="msg"></div><script>
if (localStorage.getItem("dingle_balance") === null) localStorage.setItem("dingle_balance", "20000");

function playGame() {
  let bal = parseFloat(localStorage.getItem("dingle_balance"));
  if (bal < 150) return alert("❌ Not enough balance");
  bal -= 150;
  const outcome = Math.random() > 0.5 ? 200 : 0; // Win ₦200 or nothing
  bal += outcome;
  localStorage.setItem("dingle_balance", bal);
  const history = JSON.parse(localStorage.getItem("dingle_history") || "[]");
  history.unshift({ type: "Game", result: outcome > 0 ? "Win" : "Lose", reward: outcome, cost: 150, time: new Date().toLocaleString() });
  localStorage.setItem("dingle_history", JSON.stringify(history));
  document.getElementById("msg").innerText = outcome > 0 ? `🎯 You won ₦${outcome}!` : "😢 You lost this round!";
}
</script></body>
</html>
